name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if npm run audit; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1

      - name: Check types
        run: npm run check --if-present

      - name: Run unit tests
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Test SDK 0.9.3 compatibility
        run: node --test test/sdk-0.9-compatibility.test.mjs
